name: build-360t7

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ImmortalWrt tag or branch (e.g. v25.12.2)"
        required: true
        default: "v25.12.2"
      release:
        description: "Create a GitHub Release for this build"
        type: boolean
        default: false
  push:
    tags:
      - "build-*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      IWRT_VERSION: ${{ github.event.inputs.version || 'v25.12.2' }}
      AURORA_COMMIT: 298dbcc74ddf820923a51285fb0826d429e5d7ca
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-dev rsync unzip zlib1g-dev file wget curl libelf-dev \
            swig time xsltproc zstd kmod cpio bc

      - name: Clone ImmortalWrt
        run: |
          git clone --depth 1 --branch "$IWRT_VERSION" \
            https://github.com/immortalwrt/immortalwrt openwrt
          git -C openwrt log -1 --format='ImmortalWrt: %h %s'

      - name: Add Aurora theme as a local package
        run: |
          git clone https://github.com/eamonxg/luci-theme-aurora openwrt/package/luci-theme-aurora
          git -C openwrt/package/luci-theme-aurora checkout "$AURORA_COMMIT"
          git -C openwrt/package/luci-theme-aurora log -1 --format='Aurora: %h %s'

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply build config
        run: |
          cp configs/360t7.config openwrt/.config
          make -C openwrt defconfig

      - name: Verify build config
        working-directory: openwrt
        run: |
          set -eu
          missing=0
          for sym in \
            CONFIG_TARGET_mediatek_filogic_DEVICE_qihoo_360t7 \
            CONFIG_TARGET_mediatek_filogic_DEVICE_qihoo_360t7-ubi \
            CONFIG_PACKAGE_luci \
            CONFIG_PACKAGE_luci-theme-aurora \
            CONFIG_PACKAGE_luci-app-dawn \
            CONFIG_PACKAGE_dawn \
            CONFIG_PACKAGE_wpad-openssl
          do
            if ! grep -q "^${sym}=y\$" .config; then
              echo "::error::config symbol missing: ${sym}"
              missing=1
            fi
          done
          exit $missing

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ env.IWRT_VERSION }}-${{ hashFiles('configs/360t7.config') }}
          restore-keys: |
            dl-${{ env.IWRT_VERSION }}-

      - name: Download sources
        working-directory: openwrt
        run: make -j"$(nproc)" download

      - name: Build firmware
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Collect images
        if: always()
        run: |
          mkdir -p out
          if [ -d openwrt/bin/targets/mediatek/filogic ]; then
            find openwrt/bin/targets/mediatek/filogic -maxdepth 1 -type f \
              \( -name '*.itb' -o -name '*.bin' -o -name '*.fip' -o -name 'profiles.json' \) \
              -exec cp {} out/ \;
          fi
          if [ -f openwrt/build.log ]; then cp openwrt/build.log out/; fi
          ( cd out && sha256sum * > sha256sums.txt ) || true
          ls -lh out || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ env.IWRT_VERSION }}-360t7
          path: out/*
          retention-days: 30
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: "startsWith(github.ref, 'refs/tags/') || github.event.inputs.release == 'true'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="build-$(date -u +%Y%m%d-%H%M%S)"
            gh release create "$tag" out/*.itb out/*.bin out/*.fip out/sha256sums.txt \
              --target "$GITHUB_SHA" \
              --title "ImmortalWrt ${IWRT_VERSION} for 360T7 ($tag)" \
              --notes "Images built from immortalwrt/immortalwrt ${IWRT_VERSION} for Qihoo 360T7 (MT7981B)."
          else
            gh release create "$GITHUB_REF_NAME" out/*.itb out/*.bin out/*.fip out/sha256sums.txt \
              --title "ImmortalWrt ${IWRT_VERSION} for 360T7 ($GITHUB_REF_NAME)" \
              --notes "Images built from immortalwrt/immortalwrt ${IWRT_VERSION} for Qihoo 360T7 (MT7981B)."
          fi
